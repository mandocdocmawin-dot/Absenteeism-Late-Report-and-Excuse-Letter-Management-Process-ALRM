[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/alrm-supervisord.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
directory=/var/www/html
autostart=true
autorestart=true
stopsignal=WINCH
stopasgroup=true
killasgroup=true
stopwaitsecs=75
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600 --verbose
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=75
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
