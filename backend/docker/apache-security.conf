# Enforced by Apache, including bodies sent with chunked transfer encoding.
LimitRequestBody 8388608
LimitRequestFields 100
LimitRequestFieldSize 8190

# The Docker image uses mod_php. Prevent application/.htaccess overrides
# from re-enabling the confirmed session upload-progress attack path.
<Directory /var/www/html/public>
    php_admin_flag session.upload_progress.enabled Off
</Directory>
