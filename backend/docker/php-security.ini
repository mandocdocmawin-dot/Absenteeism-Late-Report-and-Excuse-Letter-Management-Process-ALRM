; Defense in depth only: the patched PHP runtime is mandatory.
; Loaded before request parsing, unlike Laravel ini_set() calls.
session.upload_progress.enabled = Off

; ALRM accepts one evidence file per request, with a 2 MiB application limit.
file_uploads = On
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 5
max_input_vars = 1000
max_input_nesting_level = 64
max_multipart_body_parts = 1050
